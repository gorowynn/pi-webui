<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi</title>
    <style>
      :root {
        --bg: #0e0f13;
        --panel: #161821;
        --panel2: #1d2030;
        --border: #2a2e40;
        --text: #e6e7ee;
        --muted: #8b8fa3;
        --user: #2b3a5e;
        --accent: #7aa2f7;
        --ok: #9ece6a;
        --warn: #e0af68;
        --err: #f7768e;
        --think: #3b2d4d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      header .logo {
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      header select,
      header button {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 13px;
        cursor: pointer;
      }
      header select {
        max-width: 230px;
      }
      #status {
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      #dot.live {
        background: var(--ok);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px clamp(8px, 4vw, 48px) 8px;
      }
      .msg {
        max-width: 880px;
        margin: 0 auto 14px;
      }
      .bubble {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--panel);
        overflow-wrap: anywhere;
      }
      .bubble.user {
        background: var(--user);
        border-color: #3a4a72;
      }
      .role {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .role.you {
        color: #a9c0ff;
      }
      pre {
        background: #0009;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        overflow: auto;
        margin: 6px 0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
      :not(pre) > code {
        background: #ffffff14;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .think {
        border-left: 3px solid var(--accent);
        background: var(--think);
        padding: 6px 10px;
        margin: 6px 0;
        border-radius: 0 6px 6px 0;
        color: #c7c0d8;
        font-size: 13px;
      }
      details > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }
      .tool {
        max-width: 880px;
        margin: 0 auto 8px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      .tool .head {
        color: var(--muted);
      }
      .tool .head .name {
        color: var(--accent);
      }
      .tool.run .head::before {
        content: "● ";
        color: var(--warn);
        animation: pulse 1s infinite;
      }
      .tool.done .head::before {
        content: "✓ ";
        color: var(--ok);
      }
      .tool.err .head::before {
        content: "✗ ";
        color: var(--err);
      }
      .tool .out {
        color: var(--muted);
        white-space: pre-wrap;
        margin-top: 4px;
        max-height: 260px;
        overflow: auto;
      }

      .typing {
        max-width: 880px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 12px;
        height: 16px;
      }
      .typing::after {
        content: "working…";
      }

      footer {
        flex: 0 0 auto;
        background: var(--panel);
        border-top: 1px solid var(--border);
        padding: 10px clamp(8px, 4vw, 48px);
      }
      .composer {
        max-width: 880px;
        margin: 0 auto;
        position: relative;
      }
      textarea {
        width: 100%;
        min-height: 48px;
        max-height: 200px;
        resize: vertical;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        outline: none;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .bar button {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      .bar button.primary {
        background: var(--accent);
        color: #0e0f13;
        border-color: var(--accent);
        font-weight: 600;
      }
      .bar button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .bar select {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px;
        font-size: 12px;
      }
      .bar .hint {
        color: var(--muted);
        font-size: 11px;
        margin-left: auto;
      }

      #palette {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        max-height: 230px;
        overflow: auto;
        display: none;
      }
      #palette .item {
        padding: 6px 10px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
      }
      #palette .item:hover,
      #palette .item.sel {
        background: var(--accent);
        color: #0e0f13;
      }
      #palette .item .nm {
        font-weight: 600;
      }
      #palette .item .ds {
        color: var(--muted);
        font-size: 11px;
      }

      #modal {
        position: fixed;
        inset: 0;
        background: #0008;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      #modal .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        width: min(520px, 92vw);
        max-height: 86vh;
        overflow: auto;
      }
      #modal h3 {
        margin: 0 0 8px;
      }
      #modal .opts button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 4px 0;
        padding: 8px 10px;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      #modal .opts button:hover {
        border-color: var(--accent);
      }
      #modal textarea,
      #modal input[type="text"] {
        width: 100%;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        font: inherit;
      }
      #modal .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        right: 14px;
        bottom: 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        max-width: 320px;
      }
      .toast.warn {
        border-left-color: var(--warn);
      }
      .toast.err {
        border-left-color: var(--err);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">◆ pi</span>
      <select id="model" title="model"></select>
      <button id="models-btn" title="reload models">↻</button>
      <span id="status"
        ><span id="dot"></span><span id="status-text">connecting…</span></span
      >
    </header>

    <main id="transcript"></main>
    <div class="typing" id="typing" style="visibility: hidden"></div>

    <footer>
      <div class="composer">
        <div id="palette"></div>
        <textarea
          id="input"
          placeholder="Send a message…  ( / for commands/skills, Shift+Enter for newline )"
          rows="1"
        ></textarea>
        <div class="bar">
          <button id="send" class="primary">Send</button>
          <button id="stop" disabled>Stop</button>
          <select id="mode" title="how to deliver while streaming">
            <option value="auto">auto</option>
            <option value="steer">steer</option>
            <option value="followUp">follow-up</option>
          </select>
          <button id="new" title="new session">＋ New</button>
          <span class="hint">Enter = send</span>
        </div>
      </div>
    </footer>

    <div id="modal"><div class="card" id="modal-card"></div></div>

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const transcript = $("transcript");
      const inputEl = $("input");
      const sendBtn = $("send");
      const stopBtn = $("stop");
      const modeSel = $("mode");
      const modelSel = $("model");
      const dot = $("dot");
      const statusText = $("status-text");
      const typingEl = $("typing");

      let streaming = false;
      let commands = []; // [{name, description, source}]
      const toolBlocks = new Map(); // toolCallId -> {head, out}
      let cur = null; // {bubble, textPar, textBuf, thinkEl, thinkBuf}

      function api(obj) {
        return fetch("/api/cmd", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(obj),
        });
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // minimal markdown: fenced code blocks, inline code, bold, newlines outside pre
      function md(text) {
        const parts = String(text).split(/```/);
        return parts
          .map((p, i) => {
            if (i % 2 === 1) {
              const nl = p.indexOf("\n");
              const lang = nl > 0 ? p.slice(0, nl).trim() : "";
              const code = nl >= 0 ? p.slice(nl + 1) : p;
              const cls = lang ? ` class="language-${esc(lang)}"` : "";
              return `<pre><code${cls}>${esc(code.replace(/\n$/, ""))}</code></pre>`;
            }
            let t = esc(p);
            t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
            t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            return t.replace(/\n/g, "<br>");
          })
          .join("");
      }

      function nearBottom() {
        return (
          transcript.scrollHeight -
            transcript.scrollTop -
            transcript.clientHeight <
          120
        );
      }
      function scrollDown() {
        transcript.scrollTop = transcript.scrollHeight;
      }

      function addUser(text) {
        const m = document.createElement("div");
        m.className = "msg";
        m.innerHTML = `<div class="bubble user"><div class="role you">you</div></div>`;
        const b = m.querySelector(".user");
        const span = document.createElement("div");
        span.innerHTML = md(text);
        b.appendChild(span);
        transcript.appendChild(m);
        scrollDown();
      }

      function newAssistantBubble() {
        const m = document.createElement("div");
        m.className = "msg";
        m.innerHTML = `<div class="bubble"><div class="role">assistant</div></div>`;
        transcript.appendChild(m);
        cur = {
          bubble: m.querySelector(".bubble"),
          textPar: null,
          textBuf: "",
          thinkEl: null,
          thinkBuf: "",
        };
        return cur;
      }

      function ensureTextPar() {
        if (!cur || cur.textPar) return;
        const p = document.createElement("div");
        cur.bubble.appendChild(p);
        cur.textPar = p;
      }
      function renderText() {
        if (cur && cur.textPar) {
          cur.textPar.innerHTML = md(cur.textBuf);
          if (nearBottom()) scrollDown();
        }
      }
      function ensureThink() {
        if (!cur || cur.thinkEl) return;
        const d = document.createElement("details");
        d.className = "think";
        d.innerHTML = `<summary>thinking</summary><div class="tbody"></div>`;
        cur.bubble.appendChild(d);
        cur.thinkEl = d.querySelector(".tbody");
      }
      function renderThink() {
        if (cur && cur.thinkEl) {
          cur.thinkEl.textContent = cur.thinkBuf;
        }
      }

      function addToolCall(name, args) {
        if (!cur) newAssistantBubble();
        const line = document.createElement("div");
        line.style.margin = "4px 0";
        const a = args
          ? (() => {
              try {
                return JSON.stringify(args);
              } catch {
                return "";
              }
            })()
          : "";
        line.innerHTML = `<span style="color:var(--accent)">▸ ${esc(name)}</span> <code>${esc(a)}</code>`;
        cur.bubble.appendChild(line);
      }

      function toolBlock(id, name, args, running) {
        let wrap = toolBlocks.get(id);
        if (!wrap) {
          const el = document.createElement("div");
          el.className = "tool" + (running ? " run" : "");
          const a = args
            ? (() => {
                try {
                  return JSON.stringify(args);
                } catch {
                  return "";
                }
              })()
            : "";
          el.innerHTML = `<div class="head"><span class="name">${esc(name || "tool")}</span> <code>${esc(a)}</code></div><div class="out"></div>`;
          transcript.appendChild(el);
          wrap = { el, out: el.querySelector(".out") };
          toolBlocks.set(id, wrap);
        }
        if (nearBottom()) scrollDown();
        return wrap;
      }

      function note(text, cls) {
        const m = document.createElement("div");
        m.className = "msg";
        const b = document.createElement("div");
        b.className = "bubble";
        if (cls) b.style.color = `var(--${cls})`;
        b.textContent = text;
        m.appendChild(b);
        transcript.appendChild(m);
        scrollDown();
      }

      function toast(msg, kind) {
        const t = document.createElement("div");
        t.className = "toast" + (kind ? " " + kind : "");
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }

      // ---- extension UI modal ----
      const modal = $("modal"),
        card = $("modal-card");
      function showModal(html) {
        card.innerHTML = html;
        modal.style.display = "flex";
      }
      function hideModal() {
        modal.style.display = "none";
      }

      function uiRequest(req) {
        const { id, method } = req;
        if (method === "notify") {
          toast(req.message || "", req.notifyType);
          return;
        }
        if (method === "setStatus") {
          statusText.textContent =
            req.statusText || statusText.textContent.replace(/\s*•.*$/, "");
          return;
        }
        if (method === "set_editor_text") {
          inputEl.value = req.text || "";
          autosize();
          return;
        }
        if (method === "setTitle") {
          document.title = req.title || "pi";
          return;
        }
        if (method === "setWidget") return; // fire-and-forget; ignored in minimal UI

        // dialog methods
        if (method === "select") {
          const opts = req.options || [];
          showModal(
            `<h3>${esc(req.title || "Choose")}</h3><div class="opts"></div>`,
          );
          const list = card.querySelector(".opts");
          opts.forEach((o) => {
            const b = document.createElement("button");
            b.textContent = o;
            b.onclick = () => {
              hideModal();
              api({ type: "extension_ui_response", id, value: o });
            };
            list.appendChild(b);
          });
        } else if (method === "confirm") {
          showModal(
            `<h3>${esc(req.title || "Confirm")}</h3><p>${esc(req.message || "")}</p>`,
          );
          const row = document.createElement("div");
          row.className = "row";
          const yes = document.createElement("button");
          yes.textContent = "Yes";
          yes.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, confirmed: true });
          };
          const no = document.createElement("button");
          no.textContent = "No";
          no.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, confirmed: false });
          };
          row.append(yes, no);
          card.appendChild(row);
        } else if (method === "input") {
          showModal(`<h3>${esc(req.title || "Input")}</h3>`);
          const inp = document.createElement("input");
          inp.type = "text";
          inp.placeholder = req.placeholder || "";
          card.appendChild(inp);
          const row = document.createElement("div");
          row.className = "row";
          const ok = document.createElement("button");
          ok.textContent = "OK";
          ok.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, value: inp.value });
          };
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          cancel.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, cancelled: true });
          };
          row.append(ok, cancel);
          card.append(inp, row);
          setTimeout(() => inp.focus(), 10);
        } else if (method === "editor") {
          showModal(`<h3>${esc(req.title || "Edit")}</h3>`);
          const ta = document.createElement("textarea");
          ta.rows = 12;
          ta.value = req.prefill || "";
          card.appendChild(ta);
          const row = document.createElement("div");
          row.className = "row";
          const ok = document.createElement("button");
          ok.textContent = "OK";
          ok.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, value: ta.value });
          };
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          cancel.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, cancelled: true });
          };
          row.append(ok, cancel);
          card.append(ta, row);
          setTimeout(() => ta.focus(), 10);
        }
      }

      // ---- history rendering (full messages from get_messages) ----
      function renderMessage(msg) {
        if (msg.role === "user") {
          let txt = "";
          const c = msg.content;
          if (typeof c === "string") txt = c;
          else if (Array.isArray(c))
            txt = c
              .filter((b) => b.type === "text")
              .map((b) => b.text)
              .join("\n");
          addUser(txt);
        } else if (msg.role === "assistant") {
          newAssistantBubble();
          for (const b of msg.content || []) {
            if (b.type === "text") {
              cur.textBuf = b.text;
              ensureTextPar();
              renderText();
              cur.textPar = null;
              cur.textBuf = "";
            } else if (b.type === "thinking") {
              cur.thinkBuf = b.thinking || "";
              ensureThink();
              renderThink();
              cur.thinkEl = null;
              cur.thinkBuf = "";
            } else if (b.type === "toolCall") {
              addToolCall(b.name, b.arguments);
            }
          }
          cur = null;
        } else if (msg.role === "toolResult") {
          const t = (msg.content || [])
            .filter((b) => b.type === "text")
            .map((b) => b.text)
            .join("\n");
          const w = toolBlock(
            msg.toolCallId || "r" + Math.random(),
            msg.toolName || "result",
            null,
            false,
          );
          w.el.classList.remove("run");
          w.el.classList.add(msg.isError ? "err" : "done");
          w.out.textContent = t;
        } else if (msg.role === "bashExecution") {
          const m = document.createElement("div");
          m.className = "tool done";
          m.innerHTML = `<div class="head"><span class="name">bash</span> <code>${esc(msg.command || "")}</code></div><div class="out">${esc(msg.output || "")}</div>`;
          transcript.appendChild(m);
        }
      }

      // ---- streaming state ----
      function setStreaming(on) {
        streaming = on;
        dot.classList.toggle("live", on);
        typingEl.style.visibility = on ? "visible" : "hidden";
        stopBtn.disabled = !on;
        if (!on) cur = null;
      }

      // ---- event dispatch ----
      function handle(payload) {
        switch (payload.type) {
          case "agent_start":
            setStreaming(true);
            break;
          case "agent_end":
            setStreaming(false);
            break;

          case "message_start":
            if (payload.message && payload.message.role === "assistant")
              cur = newAssistantBubble();
            else if (payload.message && payload.message.role === "user") {
              /* server echoes? skip */
            }
            break;
          case "message_end":
            // finalize current text/think buffers
            if (cur) {
              renderText();
              renderThink();
            }
            cur = null;
            break;

          case "message_update": {
            const e = payload.assistantMessageEvent;
            if (!e) break;
            if (
              !cur &&
              (e.type === "text_start" ||
                e.type === "text_delta" ||
                e.type === "thinking_start" ||
                e.type === "thinking_delta" ||
                e.type === "toolcall_start")
            )
              cur = newAssistantBubble();
            if (e.type === "text_start") {
              ensureTextPar();
              cur.textBuf = "";
            } else if (e.type === "text_delta") {
              ensureTextPar();
              cur.textBuf += e.delta || "";
              renderText();
            } else if (e.type === "text_end") {
              ensureTextPar();
              if (e.content != null) cur.textBuf = e.content;
              renderText();
            } else if (e.type === "thinking_start") {
              ensureThink();
              cur.thinkBuf = "";
            } else if (e.type === "thinking_delta") {
              ensureThink();
              cur.thinkBuf += e.delta || "";
              renderThink();
            } else if (e.type === "thinking_end") {
              if (e.content != null) {
                ensureThink();
                cur.thinkBuf = e.content;
                renderThink();
              }
            } else if (e.type === "toolcall_start") {
              addToolCall(
                e.toolCall && e.toolCall.name,
                e.toolCall && e.toolCall.arguments,
              );
            } else if (e.type === "toolcall_end") {
              /* args already shown; could update */
            }
            break;
          }

          case "tool_execution_start": {
            const w = toolBlock(
              payload.toolCallId,
              payload.toolName,
              payload.args,
              true,
            );
            break;
          }
          case "tool_execution_update": {
            const w = toolBlocks.get(payload.toolCallId);
            if (w && payload.partialResult) {
              const t = (payload.partialResult.content || [])
                .filter((b) => b.type === "text")
                .map((b) => b.text)
                .join("\n");
              w.out.textContent = t;
            }
            break;
          }
          case "tool_execution_end": {
            const w = toolBlocks.get(payload.toolCallId);
            if (w) {
              w.el.classList.remove("run");
              w.el.classList.add(payload.isError ? "err" : "done");
              const t = ((payload.result && payload.result.content) || [])
                .filter((b) => b.type === "text")
                .map((b) => b.text)
                .join("\n");
              w.out.textContent = t;
            }
            if (nearBottom()) scrollDown();
            break;
          }

          case "queue_update": {
            const s = (payload.steering || []).length,
              f = (payload.followUp || []).length;
            statusText.textContent =
              s || f
                ? `queued: ${s} steer / ${f} follow-up`
                : streaming
                  ? "working…"
                  : "ready";
            break;
          }
          case "auto_retry_start":
            toast(
              `retry ${payload.attempt}/${payload.maxAttempts}: ${(payload.errorMessage || "").slice(0, 80)}`,
              "warn",
            );
            break;
          case "compaction_start":
            note("compacting context…", "warn");
            break;
          case "compaction_end":
            note("compacted.", "ok");
            break;

          case "response":
            // rpc command ack; surface failures
            if (payload.success === false)
              toast(
                `${payload.command || "cmd"} failed: ${payload.error || ""}`,
                "err",
              );
            break;

          default:
            break;
        }
      }

      // ---- SSE ----
      const es = new EventSource("/api/events");
      es.onopen = () => {
        statusText.textContent = "ready";
        api({ type: "get_state", id: "init-state" });
        api({ type: "get_messages", id: "init-msgs" });
        api({ type: "get_commands", id: "init-cmds" });
        api({ type: "get_available_models", id: "init-models" });
      };
      es.onmessage = (ev) => {
        let env;
        try {
          env = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (env.source === "pi") {
          const p = env.payload;
          // intercept init responses to populate UI
          if (p.type === "response" && p.success) {
            if (p.id === "init-state" && p.data) {
              if (p.data.isStreaming != null && p.data.isStreaming)
                setStreaming(true);
            } else if (
              p.id === "init-msgs" &&
              p.data &&
              Array.isArray(p.data.messages)
            ) {
              transcript.innerHTML = "";
              toolBlocks.clear();
              p.data.messages.forEach(renderMessage);
              scrollDown();
            } else if (
              p.id === "init-cmds" &&
              p.data &&
              Array.isArray(p.data.commands)
            ) {
              commands = p.data.commands;
            } else if (
              p.id === "init-models" &&
              p.data &&
              Array.isArray(p.data.models)
            ) {
              populateModels(p.data.models, p.data.currentId);
            }
          } else if (p.type === "extension_ui_request") {
            uiRequest(p);
          } else {
            handle(p);
          }
        } else if (env.source === "stderr") {
          // pi logs warnings here; show faintly only if it looks like an error
          if (/error|warn/i.test(env.payload))
            toast(env.payload.split("\n")[0].slice(0, 90), "warn");
        } else if (env.source === "pi_exit") {
          toast("pi subprocess exited — reconnecting…", "err");
        }
      };
      es.onerror = () => {
        statusText.textContent = "reconnecting…";
      };

      function populateModels(models, currentId) {
        modelSel.innerHTML = "";
        if (!models.length) {
          const o = document.createElement("option");
          o.textContent = "no models";
          modelSel.appendChild(o);
          return;
        }
        models.forEach((m) => {
          const o = document.createElement("option");
          const id = m.provider + "/" + m.id;
          o.value = JSON.stringify({ provider: m.provider, modelId: m.id });
          o.textContent = (m.name || m.id) + " · " + m.provider;
          if (currentId && id === currentId) o.selected = true;
          modelSel.appendChild(o);
        });
      }
      modelSel.onchange = () => {
        try {
          const v = JSON.parse(modelSel.value);
          api({ type: "set_model", provider: v.provider, modelId: v.modelId });
        } catch {}
      };
      $("models-btn").onclick = () =>
        api({ type: "get_available_models", id: "init-models" });

      // ---- composer ----
      function autosize() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(200, inputEl.scrollHeight) + "px";
      }
      inputEl.oninput = () => {
        autosize();
        updatePalette();
      };

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        autosize();
        hidePalette();
        addUser(text);
        let cmd;
        if (text.startsWith("/")) {
          // extension command / skill / template: send as prompt (rpc expands it)
          cmd = { type: "prompt", message: text };
        } else if (streaming) {
          const mode = modeSel.value;
          const how = mode === "auto" ? "steer" : mode; // default mid-stream delivery = steer
          cmd =
            how === "prompt"
              ? { type: "prompt", message: text }
              : { type: how, message: text };
        } else {
          cmd = { type: "prompt", message: text };
        }
        try {
          await api(cmd);
        } catch (e) {
          toast("send failed: " + e.message, "err");
        }
      }
      sendBtn.onclick = send;
      stopBtn.onclick = () => api({ type: "abort" });
      $("new").onclick = () => {
        if (
          confirm(
            "Start a new session? Current chat stays saved on the pi side.",
          )
        )
          api({ type: "new_session" });
      };

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      // ---- slash command palette ----
      const palette = $("palette");
      let palSel = 0;
      let palItems = [];
      function buildFilteredList(q) {
        const term = q.slice(1).toLowerCase();
        return commands
          .filter((c) => ("/" + c.name).toLowerCase().includes(term))
          .slice(0, 8);
      }
      function updatePalette() {
        const v = inputEl.value;
        if (v.startsWith("/")) {
          palItems = buildFilteredList(v);
          if (palItems.length) {
            renderPalette();
            palette.style.display = "block";
            return;
          }
        }
        hidePalette();
      }
      function renderPalette() {
        palette.innerHTML = "";
        palItems.forEach((c, i) => {
          const d = document.createElement("div");
          d.className = "item" + (i === palSel ? " sel" : "");
          d.innerHTML = `<span class="nm">/${esc(c.name)}</span> <span class="ds">${esc(c.description || c.source || "")}</span>`;
          d.onclick = () => {
            inputEl.value = "/" + c.name + " ";
            autosize();
            inputEl.focus();
            hidePalette();
          };
          palette.appendChild(d);
        });
      }
      function hidePalette() {
        palette.style.display = "none";
        palItems = [];
        palSel = 0;
      }
      inputEl.addEventListener("keydown", (e) => {
        if (palette.style.display !== "block") return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          palSel = (palSel + 1) % palItems.length;
          renderPalette();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          palSel = (palSel - 1 + palItems.length) % palItems.length;
          renderPalette();
        } else if (e.key === "Tab" && palItems.length) {
          e.preventDefault();
          inputEl.value = "/" + palItems[palSel].name + " ";
          autosize();
          hidePalette();
          inputEl.focus();
        } else if (e.key === "Escape") {
          hidePalette();
        }
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".composer")) hidePalette();
      });

      autosize();
    </script>
  </body>
</html>
