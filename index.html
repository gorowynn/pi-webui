<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="logo">◆ pi</span>
      <select id="model" title="model"></select>
      <button id="models-btn" title="reload models">↻</button>
      <button id="usage-btn" title="z.ai usage / quota">Usage</button>
      <span id="status"
        ><span id="dot"></span><span id="status-text">connecting…</span></span
      >
    </header>

    <div id="usagebar" aria-hidden="true"></div>

    <main id="transcript"></main>
    <details id="todopanel" open>
      <summary>
        <span>todos</span><span class="count" id="tp-count">0/0</span>
      </summary>
      <div class="tbody" id="tp-body"></div>
    </details>
    <div class="activity idle" id="activity">
      <span class="spin"></span><span class="idle-dot"></span
      ><span class="alabel" id="act-label">connecting…</span>
    </div>

    <footer>
      <div class="composer">
        <div id="palette"></div>
        <div id="widget"></div>
        <textarea
          id="input"
          placeholder="Send a message…  ( / for commands/skills, Shift+Enter for newline )"
          rows="1"
        ></textarea>
        <div class="bar">
          <button id="send" class="primary">Send</button>
          <button id="stop" disabled>Stop</button>
          <select id="mode" title="how to deliver while streaming">
            <option value="auto">auto</option>
            <option value="steer">steer</option>
            <option value="followUp">follow-up</option>
          </select>
          <button
            id="compact"
            title="compact context (summarize to free space)"
          >
            ⇲ Compact
          </button>
          <button id="new" title="new session">＋ New</button>
          <span class="hint">Enter = send</span>
        </div>
      </div>
      <div class="statusbar" id="statusbar">
        <span>repo <code id="sb-repo">…</code></span
        ><span class="sep">·</span> <span>git <code id="sb-git">…</code></span
        ><span class="sep">·</span>
        <span>model <code id="sb-model">…</code></span
        ><span class="sep">·</span>
        <span>think <code id="sb-think">…</code></span
        ><span class="sep">·</span> <span>ctx <code id="sb-ctx">…</code></span
        ><span class="sep">·</span>
        <span>cache <code id="sb-cache">…</code></span
        ><span class="sep">·</span> <span>tok <code id="sb-tok">…</code></span
        ><span class="sep">·</span>
        <span>$<code id="sb-cost">…</code></span>
      </div>
    </footer>

    <div id="modal" role="dialog" aria-modal="false" aria-label="pi dialog">
      <div id="modal-wrap">
        <div class="card" id="modal-card"></div>
        <button
          id="modal-x"
          class="modal-x"
          type="button"
          aria-label="Close dialog"
          hidden
        >
          &times;
        </button>
      </div>
    </div>

    <script src="md.js"></script>
    <script src="app.js"></script>
  </body>
</html>
