<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="logo">◆ pi</span>
      <div id="usagebar" aria-hidden="true"></div>
      <span id="status"
        ><span id="dot"></span><span id="status-text">connecting…</span></span
      >
      <button id="settings-btn" title="settings" aria-label="settings">
        ⚙
      </button>
    </header>

    <aside id="settings" aria-hidden="true">
      <div class="set-head">
        <h3>settings</h3>
        <button
          id="settings-close"
          class="set-x"
          type="button"
          aria-label="close settings"
        >
          &times;
        </button>
      </div>
      <section class="set-sec">
        <h4>model &amp; behavior</h4>
        <label class="set-row"
          >model
          <span class="set-inline"
            ><select id="model" title="model"></select
            ><button id="models-btn" title="reload models">↻</button></span
          >
        </label>
        <label class="set-row"
          >thinking
          <select id="think-sel" title="thinking level"></select
        ></label>
        <label class="set-row"
          >ponytail
          <select id="pony-sel" title="ponytail mode"></select
        ></label>
      </section>
      <section class="set-sec">
        <h4>subagent tiers</h4>
        <p class="set-hint">model used per delegation tier.</p>
        <label class="set-row"
          >capable
          <select
            id="tier-capable"
            title="model for planner/reviewer/debugger"
          ></select
        ></label>
        <label class="set-row"
          >implement
          <select id="tier-implement" title="model for implementer"></select
        ></label>
        <label class="set-row"
          >lookup
          <select id="tier-lookup" title="model for scout/summarizer"></select
        ></label>
      </section>
      <section class="set-sec">
        <h4>developer</h4>
        <label class="set-row"
          >subagent view
          <select id="sa-density" title="subagent live-view density">
            <option value="full">full</option>
            <option value="compact">compact</option>
          </select>
        </label>
      </section>
    </aside>
    <div id="settings-back" aria-hidden="true"></div>

    <main id="transcript"></main>
    <details id="todopanel" open>
      <summary>
        <span>todos</span><span class="count" id="tp-count">0/0</span>
      </summary>
      <div class="tbody" id="tp-body"></div>
    </details>
    <div class="activity idle" id="activity">
      <span class="spin"></span><span class="idle-dot"></span
      ><span class="alabel" id="act-label">connecting…</span>
    </div>

    <footer>
      <div class="composer">
        <div id="palette"></div>
        <div id="widget"></div>
        <textarea
          id="input"
          placeholder="Send a message…  ( / for commands/skills, Shift+Enter for newline )"
          rows="1"
        ></textarea>
        <div class="bar">
          <button id="send" class="primary">Send</button>
          <button id="stop" disabled>Stop</button>
          <select id="mode" title="how to deliver while streaming">
            <option value="auto">auto</option>
            <option value="steer">steer</option>
            <option value="followUp">follow-up</option>
          </select>
          <button
            id="compact"
            title="compact context (summarize to free space)"
          >
            ⇲ Compact
          </button>
          <button id="sessions" title="resume an older session">
            ⏱ Sessions
          </button>
          <button id="new" title="new session">＋ New</button>
          <span class="hint">Enter = send</span>
        </div>
      </div>
      <div class="statusbar" id="statusbar">
        <span>repo <code id="sb-repo">…</code></span
        ><span class="sep">·</span> <span>git <code id="sb-git">…</code></span
        ><span class="sep">·</span>
        <span>model <code id="sb-model">…</code></span
        ><span class="sep">·</span> <span>ctx <code id="sb-ctx">…</code></span
        ><span class="sep">·</span>
        <span>cache <code id="sb-cache">…</code></span
        ><span class="sep">·</span> <span>tok <code id="sb-tok">…</code></span
        ><span class="sep">·</span> <span>$<code id="sb-cost">…</code></span
        ><span class="sep">·</span>
        <span
          >ide <code id="sb-ide" title="IDE hosting this panel">…</code></span
        >
      </div>
    </footer>

    <div id="modal" role="dialog" aria-modal="false" aria-label="pi dialog">
      <div id="modal-wrap">
        <div class="card" id="modal-card"></div>
        <button
          id="modal-x"
          class="modal-x"
          type="button"
          aria-label="Close dialog"
          hidden
        >
          &times;
        </button>
      </div>
    </div>

    <script src="md.js"></script>
    <script src="app.js"></script>
  </body>
</html>
