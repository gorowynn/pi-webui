<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi</title>
    <style>
      :root {
        --bg: #0e0f13;
        --panel: #161821;
        --panel2: #1d2030;
        --border: #2a2e40;
        --text: #e6e7ee;
        --muted: #8b8fa3;
        --user: #2b3a5e;
        --accent: #7aa2f7;
        --ok: #9ece6a;
        --warn: #e0af68;
        --err: #f7768e;
        --think: #3b2d4d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      header .logo {
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      header select,
      header button {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 13px;
        cursor: pointer;
      }
      header select {
        max-width: 230px;
      }
      #status {
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      #dot.live {
        background: var(--ok);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px clamp(12px, 3vw, 40px) 8px;
      }
      .msg {
        margin: 0 0 16px;
      }
      .bubble {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 18px;
        background: var(--panel);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .bubble:not(.user) {
        border-left: 3px solid var(--accent);
        background: var(--panel2);
      }
      .bubble.user {
        background: var(--user);
        border-color: #3a4a72;
      }
      .role {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .role:not(.you) {
        color: var(--accent);
      }
      .role.you {
        color: #a9c0ff;
      }
      pre {
        background: #0009;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        overflow: auto;
        margin: 6px 0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
      :not(pre) > code {
        background: #ffffff14;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .think {
        background: var(--think);
        margin: 10px 0;
        border-radius: 8px;
        border-left: 2px solid #6b5b8a;
        overflow: hidden;
      }
      .think > summary {
        cursor: pointer;
        list-style: none;
        padding: 7px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #b9aed0;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .think > summary::-webkit-details-marker {
        display: none;
      }
      /* status indicator: spinner while streaming, caret when done. Two
         elements toggled by .thinking so we never animate a hidden node. */
      .think .tspin,
      .think .tcaret {
        width: 11px;
        flex: 0 0 11px;
        display: none;
      }
      .think .tspin {
        height: 11px;
        border-radius: 50%;
        border: 2px solid #b9aed0;
        border-top-color: transparent;
        animation: spin 0.7s linear infinite;
      }
      .think.thinking .tspin {
        display: block;
      }
      .think .tcaret {
        font-size: 10px;
        line-height: 1;
        color: var(--muted);
        transition: transform 0.15s ease;
      }
      .think:not(.thinking) .tcaret {
        display: inline-block;
      }
      .think[open]:not(.thinking) .tcaret {
        transform: rotate(90deg);
      }
      .think .tlabel {
        color: #c8bfd8;
      }
      .think .tcount {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.4px;
        opacity: 0.85;
      }
      .think .tbody {
        padding: 8px 14px 12px;
        color: #d4cbe2;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        border-top: 1px solid #ffffff14;
      }
      .tool {
        margin: 0 0 10px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #00000040;
      }
      .tool > summary {
        list-style: none;
        cursor: pointer;
        padding: 6px 10px;
        display: flex;
        gap: 6px;
        align-items: baseline;
        overflow-wrap: anywhere;
      }
      .tool > summary::-webkit-details-marker {
        display: none;
      }
      .tool .head {
        color: var(--muted);
        flex: 1;
      }
      .tool .head .name {
        color: var(--accent);
      }
      .tool .caret {
        color: var(--muted);
        font-size: 10px;
        transition: transform 0.15s ease;
      }
      .tool[open] .caret {
        transform: rotate(90deg);
      }
      .tool.run > summary .name::before {
        content: "● ";
        color: var(--warn);
        animation: pulse 1s infinite;
      }
      .tool.done > summary .name::before {
        content: "✓ ";
        color: var(--ok);
      }
      .tool.err > summary .name::before {
        content: "✗ ";
        color: var(--err);
      }
      .tool .out {
        color: var(--muted);
        white-space: pre-wrap;
        margin: 0;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
        max-height: 320px;
        overflow: auto;
      }

      .activity {
        flex: 0 0 auto;
        margin: 0;
        padding: 5px clamp(12px, 3vw, 40px);
        color: var(--muted);
        font-size: 12px;
        height: 26px;
        display: flex;
        gap: 8px;
        align-items: center;
        border-top: 1px solid var(--border);
        background: var(--bg);
      }
      .activity .spin {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        border-top-color: transparent;
        animation: spin 0.7s linear infinite;
        flex: 0 0 11px;
        display: none;
      }
      .activity .idle-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        flex: 0 0 7px;
        opacity: 0.55;
        display: none;
      }
      .activity.working .spin {
        display: block;
      }
      .activity.idle .idle-dot {
        display: block;
      }
      .activity .alabel {
        color: var(--muted);
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .activity.working .alabel {
        color: var(--accent);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* markdown inside assistant bubbles */
      .bubble p {
        margin: 0 0 10px;
      }
      .bubble p:last-child {
        margin-bottom: 0;
      }
      .bubble h1,
      .bubble h2,
      .bubble h3,
      .bubble h4,
      .bubble h5,
      .bubble h6 {
        margin: 14px 0 6px;
        line-height: 1.3;
        color: var(--text);
      }
      .bubble h1 {
        font-size: 1.5em;
      }
      .bubble h2 {
        font-size: 1.3em;
      }
      .bubble h3 {
        font-size: 1.15em;
      }
      .bubble h4,
      .bubble h5,
      .bubble h6 {
        font-size: 1em;
      }
      .bubble ul,
      .bubble ol {
        margin: 0 0 10px;
        padding-left: 22px;
      }
      .bubble li {
        margin: 2px 0;
      }
      .bubble blockquote {
        margin: 0 0 10px;
        padding: 2px 12px;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }
      .bubble hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 12px 0;
      }
      .bubble a {
        color: var(--accent);
        text-decoration: none;
      }
      .bubble a:hover {
        text-decoration: underline;
      }
      .bubble table {
        border-collapse: collapse;
        margin: 0 0 10px;
        font-size: 13px;
        display: block;
        overflow-x: auto;
      }
      .bubble th,
      .bubble td {
        border: 1px solid var(--border);
        padding: 4px 8px;
        text-align: left;
      }
      .bubble th {
        background: var(--panel2);
      }

      /* edit diff */
      pre.diff {
        margin: 4px 0;
        padding: 6px 0;
        font-size: 12px;
        line-height: 1.45;
      }
      pre.diff .add,
      pre.diff .del,
      pre.diff .ctx {
        display: block;
        padding: 0 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      pre.diff .add {
        background: #9ece6a22;
        color: #b5e89a;
      }
      pre.diff .add::before {
        content: "+ ";
      }
      pre.diff .del {
        background: #f7768e22;
        color: #f0a0b0;
      }
      pre.diff .del::before {
        content: "- ";
      }
      pre.diff .ctx {
        color: var(--muted);
      }
      .tool .dpath {
        color: var(--muted);
        padding: 2px 10px;
        font-size: 11px;
      }
      .tool .dhunk {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        padding: 4px 10px 0;
      }

      footer {
        flex: 0 0 auto;
        background: var(--panel);
        border-top: 1px solid var(--border);
        padding: 10px clamp(8px, 4vw, 48px);
      }
      .statusbar {
        margin: 8px 0 0;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: center;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: thin;
      }
      .statusbar code {
        color: var(--text);
        font-size: 11px;
      }
      .statusbar .sep {
        opacity: 0.4;
      }
      .composer {
        margin: 0;
        position: relative;
      }
      textarea {
        width: 100%;
        min-height: 48px;
        max-height: 200px;
        resize: vertical;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        outline: none;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .bar button {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      .bar button.primary {
        background: var(--accent);
        color: #0e0f13;
        border-color: var(--accent);
        font-weight: 600;
      }
      .bar button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .bar select {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px;
        font-size: 12px;
      }
      .bar .hint {
        color: var(--muted);
        font-size: 11px;
        margin-left: auto;
      }

      #palette {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        max-height: 230px;
        overflow: auto;
        display: none;
      }
      #palette .item {
        padding: 6px 10px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
      }
      #palette .item:hover,
      #palette .item.sel {
        background: var(--accent);
        color: #0e0f13;
      }
      #palette .item .nm {
        font-weight: 600;
      }
      #palette .item .ds {
        color: var(--muted);
        font-size: 11px;
      }

      #modal {
        position: fixed;
        inset: 0;
        background: #0008;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      #modal .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        width: min(640px, 94vw);
        max-height: 86vh;
        overflow: auto;
      }
      #modal h3 {
        margin: 0 0 10px;
      }
      #modal .cmd {
        margin: 0 0 10px;
        padding: 10px 12px;
        background: #00000060;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 50vh;
        overflow: auto;
        color: var(--text);
      }
      #modal details.cmd {
        padding: 0;
        overflow: hidden;
      }
      #modal details.cmd > summary {
        list-style: none;
        cursor: pointer;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #modal details.cmd > summary::-webkit-details-marker {
        display: none;
      }
      #modal details.cmd > summary::before {
        content: "▸";
        font-size: 10px;
        transition: transform 0.15s ease;
      }
      #modal details.cmd[open] > summary::before {
        transform: rotate(90deg);
      }
      #modal details.cmd[open] > summary {
        border-bottom: 1px solid var(--border);
      }
      #modal details.cmd > .cmdbody {
        padding: 10px 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 44vh;
        overflow: auto;
        color: var(--text);
      }
      #modal .opts button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 4px 0;
        padding: 8px 10px;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      #modal .opts button:hover {
        border-color: var(--accent);
      }
      #modal .opts button .desc {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
        font-weight: 400;
      }
      #widget {
        display: none;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 8px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
        white-space: pre-wrap;
        color: var(--text);
        max-height: 240px;
        overflow: auto;
      }
      #widget .whead {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 10px;
        margin-bottom: 4px;
      }
      #modal textarea,
      #modal input[type="text"] {
        width: 100%;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        font: inherit;
      }
      #modal .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        right: 14px;
        bottom: 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        max-width: 320px;
      }
      .toast.warn {
        border-left-color: var(--warn);
      }
      .toast.err {
        border-left-color: var(--err);
      }

      #todopanel {
        width: 100%;
        margin: 0 0 8px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0;
        font-size: 12px;
        max-height: 40vh;
        overflow: hidden;
        display: none;
      }
      #todopanel > summary {
        list-style: none;
        cursor: pointer;
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel2);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      #todopanel > summary::-webkit-details-marker {
        display: none;
      }
      #todopanel > summary .count {
        color: var(--accent);
        font-weight: 700;
      }
      #todopanel .tbody {
        padding: 6px 12px;
        max-height: 32vh;
        overflow: auto;
      }
      #todopanel .ti {
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: 4px 0;
        border-bottom: 1px solid #ffffff0d;
      }
      #todopanel .ti:last-child {
        border-bottom: none;
      }
      #todopanel .ti .ck {
        width: 12px;
        flex: 0 0 12px;
      }
      #todopanel .ti .ck.done {
        color: var(--ok);
      }
      #todopanel .ti .ck.live {
        color: var(--warn);
      }
      #todopanel .ti .ck.pend {
        color: var(--muted);
      }
      #todopanel .ti.done .sbj {
        color: var(--muted);
        text-decoration: line-through;
      }
      #todopanel .ti.live .sbj {
        color: var(--text);
      }
      #todopanel .ti .id {
        color: var(--accent);
        flex: 0 0 auto;
      }
      #todopanel .empty {
        color: var(--muted);
        padding: 10px 0;
        text-align: center;
      }

      #modal .qform {
        margin: 0;
      }
      #modal .qblk {
        margin-bottom: 18px;
      }
      #modal .qblk:last-child {
        margin-bottom: 8px;
      }
      #modal .qchip {
        display: inline-block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      #modal .qq {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.45;
      }
      #modal .qopt {
        display: block;
        width: 100%;
        text-align: left;
        margin: 5px 0;
        padding: 9px 12px;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
      }
      #modal .qopt:hover {
        border-color: var(--accent);
      }
      #modal .qopt.sel {
        border-color: var(--accent);
        background: #1a2342;
      }
      #modal .qopt .qlbl {
        font-weight: 600;
      }
      #modal .qopt .qdesc {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
        font-weight: 400;
      }
      #modal .qrow {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      #modal .qrow input {
        flex: 1;
      }
      #modal .qlink {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        text-decoration: underline;
        padding: 4px;
      }
      #modal .qlink:hover {
        color: var(--text);
      }

      /* multistep questionnaire: step indicator + side-by-side preview */
      #modal .qprog {
        margin-bottom: 12px;
      }
      #modal .qsteps {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        margin-bottom: 5px;
      }
      #modal .qbar {
        height: 4px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      #modal .qbar > i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.18s ease;
      }
      #modal .qbody.split {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: stretch;
      }
      #modal .qbody.split .qopts {
        flex: 1 1 58%;
        min-width: 220px;
      }
      #modal .qbody.split .qprev {
        flex: 1 1 38%;
        min-width: 180px;
      }
      #modal .qprev {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        overflow: auto;
        max-height: 46vh;
      }
      #modal .qprev-h {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 10px;
        margin-bottom: 6px;
      }
      #modal .qprev-b {
        margin: 0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--text);
      }
      #modal .qsubmit {
        border-color: var(--accent);
      }
      #modal .qfoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">◆ pi</span>
      <select id="model" title="model"></select>
      <button id="models-btn" title="reload models">↻</button>
      <span id="status"
        ><span id="dot"></span><span id="status-text">connecting…</span></span
      >
    </header>

    <main id="transcript"></main>
    <div class="activity idle" id="activity">
      <span class="spin"></span><span class="idle-dot"></span
      ><span class="alabel" id="act-label">connecting…</span>
    </div>

    <footer>
      <details id="todopanel" open>
        <summary>
          <span>todos</span><span class="count" id="tp-count">0/0</span>
        </summary>
        <div class="tbody" id="tp-body"></div>
      </details>
      <div class="composer">
        <div id="palette"></div>
        <div id="widget"></div>
        <textarea
          id="input"
          placeholder="Send a message…  ( / for commands/skills, Shift+Enter for newline )"
          rows="1"
        ></textarea>
        <div class="bar">
          <button id="send" class="primary">Send</button>
          <button id="stop" disabled>Stop</button>
          <select id="mode" title="how to deliver while streaming">
            <option value="auto">auto</option>
            <option value="steer">steer</option>
            <option value="followUp">follow-up</option>
          </select>
          <button id="new" title="new session">＋ New</button>
          <span class="hint">Enter = send</span>
        </div>
      </div>
      <div class="statusbar" id="statusbar">
        <span>repo <code id="sb-repo">…</code></span
        ><span class="sep">·</span> <span>git <code id="sb-git">…</code></span
        ><span class="sep">·</span>
        <span>model <code id="sb-model">…</code></span
        ><span class="sep">·</span>
        <span>think <code id="sb-think">…</code></span
        ><span class="sep">·</span> <span>ctx <code id="sb-ctx">…</code></span
        ><span class="sep">·</span>
        <span>cache <code id="sb-cache">…</code></span
        ><span class="sep">·</span> <span>tok <code id="sb-tok">…</code></span
        ><span class="sep">·</span>
        <span>$<code id="sb-cost">…</code></span>
      </div>
    </footer>

    <div id="modal"><div class="card" id="modal-card"></div></div>

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const transcript = $("transcript");
      const inputEl = $("input");
      const sendBtn = $("send");
      const stopBtn = $("stop");
      const modeSel = $("mode");
      const modelSel = $("model");
      const dot = $("dot");
      const statusText = $("status-text");
      const activityEl = $("activity");
      const actLabel = $("act-label");

      let streaming = false;
      let commands = []; // [{name, description, source}]
      const toolBlocks = new Map(); // toolCallId -> {head, out}
      let cur = null; // {bubble, textPar, textBuf, thinkEl, thinkBuf}

      function api(obj) {
        return fetch("/api/cmd", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(obj),
        });
      }
      // ponytail: pi sends ANSI-colored status strings (e.g. "LSP Inactive"); the
      // browser can't render them, so strip the escapes at the status boundary.
      const stripAnsi = (s) =>
        String(s).replace(/\u001b\[[0-9;]*[A-Za-z]/g, "");

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // ---- markdown: fenced code, headings, lists, tables, blockquotes, hr, links ----
      // ponytail: zero-dep inline parser. Block-level split (code vs prose), then
      // per-line block detection, then inline formatting with code-span protection
      // (placeholders so ** / * never touch code contents).
      function inlineMd(sEsc) {
        const codes = [];
        let s = sEsc.replace(
          /`([^`]+)`/g,
          (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`),
        );
        s = s
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
          .replace(/~~([^~]+)~~/g, "<del>$1</del>")
          .replace(
            /\[([^\]]+)\]\(([^)\s]+)(?: +"([^"]*)")?\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer" title="$4">$1</a>',
          );
        return s.replace(
          /\u0000(\d+)\u0000/g,
          (_, i) => "<code>" + codes[+i] + "</code>",
        );
      }
      function splitRow(line) {
        return line
          .trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map((c) => c.trim());
      }
      function mdProse(src) {
        const lines = src.split("\n");
        const out = [];
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) {
            i++;
            continue;
          }
          let m = /^(#{1,6})\s+(.*)$/.exec(line);
          if (m) {
            out.push(
              `<h${m[1].length}>${inlineMd(esc(m[2]))}</h${m[1].length}>`,
            );
            i++;
            continue;
          }
          if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
            out.push("<hr>");
            i++;
            continue;
          }
          if (/^>\s?/.test(line)) {
            const buf = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) {
              buf.push(lines[i].replace(/^>\s?/, ""));
              i++;
            }
            out.push(`<blockquote>${mdProse(buf.join("\n"))}</blockquote>`);
            continue;
          }
          // table: header row + next line is a separator of |, -, :
          if (
            /\|/.test(line) &&
            i + 1 < lines.length &&
            /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) &&
            /\|/.test(lines[i + 1])
          ) {
            const header = splitRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && /\|/.test(lines[i])) {
              rows.push(splitRow(lines[i]));
              i++;
            }
            const th = header
              .map((h) => `<th>${inlineMd(esc(h))}</th>`)
              .join("");
            const trs = rows
              .map(
                (r) =>
                  `<tr>${r.map((c) => `<td>${inlineMd(esc(c))}</td>`).join("")}</tr>`,
              )
              .join("");
            out.push(
              `<table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`,
            );
            continue;
          }
          if (/^\s*[-*+]\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*[-*+]\s+/, ""));
              i++;
            }
            out.push(
              "<ul>" +
                items.map((it) => `<li>${inlineMd(esc(it))}</li>`).join("") +
                "</ul>",
            );
            continue;
          }
          if (/^\s*\d+\.\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
              i++;
            }
            out.push(
              "<ol>" +
                items.map((it) => `<li>${inlineMd(esc(it))}</li>`).join("") +
                "</ol>",
            );
            continue;
          }
          // paragraph: gather until blank/special/pipe
          const buf = [];
          while (
            i < lines.length &&
            lines[i].trim() &&
            !/^(#{1,6}\s|>\s?|\s*[-*+]\s|\s*\d+\.\s|\s*(-{3,}|\*{3,}|_{3,})\s*$)/.test(
              lines[i],
            ) &&
            !/\|/.test(lines[i])
          ) {
            buf.push(lines[i]);
            i++;
          }
          if (buf.length) {
            out.push(
              `<p>${inlineMd(esc(buf.join("\n"))).replace(/\n/g, "<br>")}</p>`,
            );
          } else {
            // ponytail: unhandled single line (e.g. a stray `|` that isn't a
            // table row, since the table branch above already consumed valid
            // tables). Render it as its own paragraph so i always advances —
            // without this the outer while spins forever on a pipe line and
            // freezes the tab.
            out.push(`<p>${inlineMd(esc(lines[i]))}</p>`);
            i++;
          }
        }
        return out.join("");
      }
      function md(text) {
        const src = String(text == null ? "" : text);
        if (!src) return "";
        // split on fenced code blocks; odd segments are code.
        const segs = src.split(/(```[\s\S]*?```)/g);
        let html = "";
        for (let k = 0; k < segs.length; k++) {
          const seg = segs[k];
          if (!seg) continue;
          if (seg.startsWith("```")) {
            const body = seg.slice(3);
            const nl = body.indexOf("\n");
            const lang = (nl >= 0 ? body.slice(0, nl) : "").trim();
            const code = nl >= 0 ? body.slice(nl + 1) : "";
            const cls = lang ? ` class="language-${esc(lang)}"` : "";
            html += `<pre><code${cls}>${esc(code.replace(/\n$/, ""))}</code></pre>`;
          } else {
            html += mdProse(seg);
          }
        }
        return html;
      }

      function nearBottom() {
        return (
          transcript.scrollHeight -
            transcript.scrollTop -
            transcript.clientHeight <
          120
        );
      }
      function scrollDown() {
        transcript.scrollTop = transcript.scrollHeight;
      }
      // ponytail: follow new output unless the user scrolled up to read.
      let pinned = true;
      transcript.addEventListener("scroll", () => {
        pinned = nearBottom();
      });
      function autoscroll() {
        if (pinned) scrollDown();
      }

      function addUser(text) {
        const m = document.createElement("div");
        m.className = "msg";
        m.innerHTML = `<div class="bubble user"><div class="role you">you</div></div>`;
        const b = m.querySelector(".user");
        const span = document.createElement("div");
        span.innerHTML = md(text);
        b.appendChild(span);
        transcript.appendChild(m);
        pinned = true;
        scrollDown();
      }

      function newAssistantBubble() {
        const m = document.createElement("div");
        m.className = "msg";
        m.innerHTML = `<div class="bubble"><div class="role">assistant</div></div>`;
        transcript.appendChild(m);
        cur = {
          bubble: m.querySelector(".bubble"),
          textPar: null,
          textBuf: "",
          thinkEl: null,
          thinkDetails: null,
          thinkLabel: null,
          thinkCount: null,
          thinkBuf: "",
        };
        return cur;
      }

      function ensureTextPar() {
        if (!cur || cur.textPar) return;
        const p = document.createElement("div");
        cur.bubble.appendChild(p);
        cur.textPar = p;
      }
      function renderText() {
        if (cur && cur.textPar) {
          cur.textPar.innerHTML = md(cur.textBuf);
          autoscroll();
        }
      }
      // ponytail: thinking-block lifecycle. The <details> carries its own
      // state: the .thinking class swaps the summary indicator from caret to
      // spinner and drives a small live character count (so a collapsed trace
      // still shows it's alive). The body is painted ONLY when the block is
      // open or being finalized — rewriting a tens-of-KB pre-wrap node the
      // user can't see is pure layout thrash and freezes the tab on long
      // reasoning traces. The latest buffer is mirrored onto the element
      // (d.__buf) so the toggle handler can paint lazily on open even after
      // cur has moved on.
      function ensureThink(active) {
        if (!cur || cur.thinkEl) return;
        const d = document.createElement("details");
        d.className = "think" + (active ? " thinking" : "");
        d.innerHTML =
          `<summary><span class="tspin"></span><span class="tcaret">▸</span>` +
          `<span class="tlabel">${active ? "thinking" : "thoughts"}</span>` +
          `<span class="tcount"></span></summary><div class="tbody"></div>`;
        const body = d.querySelector(".tbody");
        cur.bubble.appendChild(d);
        cur.thinkEl = body;
        cur.thinkDetails = d;
        cur.thinkLabel = d.querySelector(".tlabel");
        cur.thinkCount = d.querySelector(".tcount");
        // opened a collapsed trace — paint whatever we have right now (the
        // streaming path skips body paints while closed).
        d.addEventListener("toggle", () => {
          if (d.open) body.textContent = d.__buf || body.textContent || "";
        });
      }
      function finalizeThink() {
        if (!cur || !cur.thinkDetails) return;
        cur.thinkDetails.classList.remove("thinking");
        if (cur.thinkLabel) cur.thinkLabel.textContent = "thoughts";
        if (cur.thinkCount) cur.thinkCount.textContent = "";
      }
      // ponytail: throttle thinking paints to ~3/s while streaming. A long
      // reasoning trace can be tens of KB; rewriting textContent every rAF
      // forces a full layout+paint of a giant pre-wrap block each frame and
      // freezes the tab. force=true bypasses the throttle for the immediate
      // final paint on thinking_end / message_end.
      let lastThinkPaint = 0;
      function renderThink(force) {
        if (!cur || !cur.thinkEl || !cur.thinkDetails) return;
        const now = performance.now();
        const throttled = !force && now - lastThinkPaint < 300;
        const buf = cur.thinkBuf;
        // always remember the buffer on the node so opening a collapsed trace
        // (live or historical) can paint without cur still being valid.
        cur.thinkDetails.__buf = buf;
        // cheap progress tick on the summary — only while streaming
        if (
          !throttled &&
          cur.thinkCount &&
          cur.thinkDetails.classList.contains("thinking")
        ) {
          cur.thinkCount.textContent = buf.length
            ? `${(buf.length / 1000).toFixed(1)}k`
            : "";
        }
        if (throttled) return;
        lastThinkPaint = now;
        // expensive body paint only when visible or finalizing
        if (force || cur.thinkDetails.open) {
          cur.thinkEl.textContent = buf;
          autoscroll();
        }
      }
      // ponytail: coalesce per-token paints to one rAF. md() parses the whole
      // buffer each call, so per-token renderText is O(n²) and freezes long
      // answers. Delta handlers schedule; _end/finalize paths still render
      // directly for an immediate final paint.
      let renderRaf = 0;
      function scheduleRender() {
        if (renderRaf) return;
        renderRaf = requestAnimationFrame(() => {
          renderRaf = 0;
          renderText(); // both no-op unless their buffer/element exists
          renderThink();
        });
      }

      function addToolCall(name, args) {
        if (!cur) newAssistantBubble();
        const line = document.createElement("div");
        line.style.margin = "4px 0";
        const a = args
          ? (() => {
              try {
                return JSON.stringify(args);
              } catch {
                return "";
              }
            })()
          : "";
        line.innerHTML = `<span style="color:var(--accent)">▸ ${esc(name || "tool")}</span> <code>${esc(a)}</code>`;
        cur.bubble.appendChild(line);
        autoscroll();
      }

      function toolBlock(id, name, args, running) {
        let wrap = toolBlocks.get(id);
        if (!wrap) {
          const el = document.createElement("details");
          el.className = "tool" + (running ? " run" : "");
          if (running) el.open = true;
          const a = args ? JSON.stringify(args) : "";
          el.innerHTML = `<summary class="head"><span class="caret">▸</span><span class="name">${esc(name || "tool")}</span> <code>${esc(a)}</code></summary><div class="out"></div>`;
          transcript.appendChild(el);
          wrap = { el, out: el.querySelector(".out") };
          toolBlocks.set(id, wrap);
        }
        autoscroll();
        return wrap;
      }

      // ---- edit diff: LCS line diff from oldText/newText args ----
      // ponytail: O(n*m) Uint32Array DP table. Fine for typical edits; swap for
      // Myers if huge files start lagging the UI.
      function diffLines(a, b) {
        const A = String(a).split("\n");
        const B = String(b).split("\n");
        const n = A.length,
          m = B.length;
        const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
        for (let i = n - 1; i >= 0; i--)
          for (let j = m - 1; j >= 0; j--)
            dp[i][j] =
              A[i] === B[j]
                ? dp[i + 1][j + 1] + 1
                : Math.max(dp[i + 1][j], dp[i][j + 1]);
        const res = [];
        let i = 0,
          j = 0;
        while (i < n && j < m) {
          if (A[i] === B[j]) {
            res.push({ t: "ctx", s: A[i] });
            i++;
            j++;
          } else if (dp[i + 1][j] >= dp[i][j + 1]) {
            res.push({ t: "del", s: A[i] });
            i++;
          } else {
            res.push({ t: "add", s: B[j] });
            j++;
          }
        }
        while (i < n) {
          res.push({ t: "del", s: A[i] });
          i++;
        }
        while (j < m) {
          res.push({ t: "add", s: B[j] });
          j++;
        }
        return res;
      }
      function renderEditDiff(args) {
        const path = args && args.path ? esc(args.path) : "";
        const edits = (args && args.edits) || [];
        let h = path ? `<div class="dpath">${path}</div>` : "";
        edits.forEach((e, idx) => {
          if (edits.length > 1)
            h += `<div class="dhunk">edit ${idx + 1}/${edits.length}</div>`;
          const d = diffLines(e.oldText || "", e.newText || "");
          h +=
            '<pre class="diff">' +
            d.map((r) => `<span class="${r.t}">${esc(r.s)}</span>`).join("") +
            "</pre>";
        });
        return h;
      }

      // ---- working indicator: spinner + current activity ----
      function describeTool(name, args) {
        if (!args) return name || "tool";
        if (name === "edit" || name === "write")
          return `${name} ${args.path || ""}`;
        if (name === "read") return `reading ${args.path || ""}`;
        if (name === "bash")
          return `bash: ${String(args.command || "").slice(0, 60)}`;
        if (name === "grep" || name === "find")
          return `${name}: ${args.pattern || args.path || ""}`;
        if (name === "todo") return `todo: ${args.action || ""}`;
        if (name === "web_search" || name === "web_fetch")
          return `${name}: ${String(args.query || args.url || "").slice(0, 60)}`;
        return name || "tool";
      }
      // ---- activity bar: one line above the chatbox that reports what the
      // session is doing right now — "thinking…", "running bash: npm test",
      // "waiting for your input…", or "ready" when idle and waiting for you.
      // `working` swaps the spinner in and tints the label accent; `idle`
      // shows a dim dot so it's obvious the turn is yours.
      let lastActivity = "";
      function setActivity(label, working) {
        const key = (working ? "1:" : "0:") + label;
        if (key === lastActivity) return;
        lastActivity = key;
        activityEl.className = "activity " + (working ? "working" : "idle");
        actLabel.textContent = label;
      }

      function note(text, cls) {
        const m = document.createElement("div");
        m.className = "msg";
        const b = document.createElement("div");
        b.className = "bubble";
        if (cls) b.style.color = `var(--${cls})`;
        b.textContent = text;
        m.appendChild(b);
        transcript.appendChild(m);
        scrollDown();
      }

      function toast(msg, kind) {
        const t = document.createElement("div");
        t.className = "toast" + (kind ? " " + kind : "");
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }

      // ---- extension UI modal ----
      const modal = $("modal"),
        card = $("modal-card");
      function showModal(html) {
        card.innerHTML = html;
        modal.style.display = "flex";
      }
      function hideModal() {
        modal.style.display = "none";
      }

      // ---- todo panel: reconstruct state from rpiv-todo result texts ----
      const todopanel = $("todopanel"),
        tpBody = $("tp-body"),
        tpCount = $("tp-count");
      let todos = []; // {id, subject, status}
      function parseTodo(text) {
        if (!text) {
          renderTodos();
          return;
        }
        let m;
        // Multi-line list output: [status] #id subject [(activeForm)] [⛓ deps].
        // ponytail: list is the source of truth — rebuild fully when present.
        const listLines = text
          .split("\n")
          .filter((l) => /^\[\w+\]\s*#\d+/.test(l));
        if (listLines.length) {
          todos = listLines
            .map((l) => {
              const lm = /^\[(\w+)\]\s*#(\d+)\s+(.*)$/.exec(l);
              if (!lm) return null;
              let subject = lm[3];
              const depIdx = subject.indexOf("⛓");
              if (depIdx !== -1) subject = subject.slice(0, depIdx);
              return { id: +lm[2], subject: subject.trim(), status: lm[1] };
            })
            .filter(Boolean);
          renderTodos();
          return;
        }
        if ((m = /^Created #(\d+):\s*(.*?)\s*\((\w+)\)/.exec(text))) {
          const ex = todos.find((t) => t.id === +m[1]);
          if (ex) {
            ex.subject = m[2];
            ex.status = m[3];
          } else {
            todos.push({ id: +m[1], subject: m[2], status: m[3] });
          }
        } else if ((m = /^Updated #(\d+)\s*\(\w+\s*→\s*(\w+)\)/.exec(text))) {
          const ex = todos.find((t) => t.id === +m[1]);
          if (ex) ex.status = m[2];
        } else if ((m = /^Deleted #(\d+):/.exec(text))) {
          todos = todos.filter((t) => t.id !== +m[1]);
        } else if (/^Cleared \d+ (todos?|tasks?)/.test(text)) {
          todos = [];
        }
        renderTodos();
      }
      function renderTodos() {
        if (!todos.length) {
          todopanel.style.display = "none";
          return;
        }
        todopanel.style.display = "block";
        const done = todos.filter((t) => t.status === "completed").length;
        tpCount.textContent = `${done}/${todos.length}`;
        tpBody.innerHTML = "";
        todos.forEach((t) => {
          const row = document.createElement("div");
          row.className =
            "ti " + (t.status === "completed" ? "done" : t.status);
          const ck =
            t.status === "completed"
              ? "✓"
              : t.status === "in_progress"
                ? "●"
                : "○";
          row.innerHTML = `<span class="ck ${t.status === "completed" ? "done" : t.status === "in_progress" ? "live" : "pend"}">${ck}</span><span class="id">#${t.id}</span><span class="sbj">${esc(t.subject)}</span>`;
          tpBody.appendChild(row);
        });
      }

      // ---- ask_user_question: rich modal, answer flows back as the tool result ----
      // pi-webui extension shadows the npm tool (which auto-declines in RPC mode:
      // ctx.ui.custom is a no-op stub). The extension blocks on ctx.ui.input(MARKER);
      // tool_execution_start already shipped the full args (previews/multiselect) here,
      // so we render the rich modal from args and reply with a JSON-encoded result.
      const ASK_MARKER = "\u0000pi-webui:ask-user-question";
      // ponytail: rendezvous latch. tool_execution_start args and the extension's
      // ctx.ui.input(MARKER) request arrive in indeterminate order; storing the id
      // only on pendingAsk loses it when the input request lands before the modal
      // is drawn. askId survives between the two regardless of arrival order.
      let askId = null; // extension_ui_response id for the active questionnaire
      let pendingAsk = null; // {qs} — modal state while a questionnaire is on screen
      function askQuestion(args) {
        const qs = (args && args.questions) || [];
        if (!qs.length) return;
        pendingAsk = { qs };
        const answers = qs.map(() => null); // per-question: string | string[]
        let step = 0; // current question index (one-at-a-time multistep)
        const total = qs.length;
        modal.style.display = "flex";

        // advance to the next question, or commit once the last is answered
        function choose(qi, value) {
          answers[qi] = value;
          if (qi + 1 < total) {
            step = qi + 1;
            renderStep();
          } else {
            commit();
          }
        }

        // ponytail: one chat-kind answer for q0 → envelope tells the model to continue.
        function goChat() {
          if (askId) {
            const result = {
              cancelled: false,
              answers: [
                {
                  questionIndex: 0,
                  question: qs[0].question,
                  kind: "chat",
                  answer: "Chat about this",
                },
              ],
            };
            api({
              type: "extension_ui_response",
              id: askId,
              value: JSON.stringify(result),
            });
            askId = null;
          }
          setActivity("thinking…", true);
          hideModal();
        }

        function renderStep() {
          const qi = step;
          const q = qs[qi];
          const multi = !!q.multiSelect;
          const opts = (q.options || []).map((o) =>
            typeof o === "string" ? { label: o } : o,
          );
          // previews switch single-select to a side-by-side layout and suppress
          // the "Type something." custom row (no room in the split).
          const hasPreview =
            !multi && opts.some((o) => o.preview && o.preview.length);

          card.innerHTML = "";
          const form = document.createElement("div");
          form.className = "qform";

          // step indicator + progress bar (only meaningful with >1 question)
          if (total > 1) {
            const prog = document.createElement("div");
            prog.className = "qprog";
            prog.innerHTML =
              `<div class="qsteps">Step ${qi + 1} of ${total}</div>` +
              `<div class="qbar"><i style="width:${((qi + 1) / total) * 100}%"></i></div>`;
            form.appendChild(prog);
          }

          const blk = document.createElement("div");
          blk.className = "qblk";
          blk.innerHTML =
            (q.header ? `<span class="qchip">${esc(q.header)}</span>` : "") +
            `<p class="qq">${esc(q.question)}</p>`;

          const body = document.createElement("div");
          body.className = "qbody" + (hasPreview ? " split" : "");
          const list = document.createElement("div");
          list.className = "qopts";

          const optBtn = (o, lbl) => {
            const b = document.createElement("button");
            b.className = "qopt";
            b.innerHTML =
              `<span class="qlbl">${esc(lbl)}</span>` +
              (o.description
                ? `<span class="qdesc">${esc(o.description)}</span>`
                : "");
            return b;
          };

          if (multi) {
            const chosen = new Set(
              Array.isArray(answers[qi]) ? answers[qi] : [],
            );
            opts.forEach((o) => {
              const lbl = o.label;
              const b = optBtn(o, lbl);
              const sync = () => {
                b.classList.toggle("sel", chosen.has(lbl));
                b.querySelector(".qlbl").textContent =
                  (chosen.has(lbl) ? "☑ " : "☐ ") + lbl;
              };
              sync();
              b.onclick = () => {
                if (chosen.has(lbl)) chosen.delete(lbl);
                else chosen.add(lbl);
                sync();
                submit.querySelector(".qlbl").textContent =
                  `Submit${chosen.size ? " (" + chosen.size + ")" : ""}`;
              };
              list.appendChild(b);
            });
            const submit = document.createElement("button");
            submit.className = "qopt qsubmit";
            submit.innerHTML = `<span class="qlbl">Submit${chosen.size ? " (" + chosen.size + ")" : ""}</span>`;
            submit.onclick = () => choose(qi, [...chosen]);
            list.appendChild(submit);
          } else {
            opts.forEach((o) => {
              const lbl = o.label;
              const b = optBtn(o, lbl);
              b.onclick = () => choose(qi, lbl);
              list.appendChild(b);
            });
            if (!hasPreview) {
              const row = document.createElement("div");
              row.className = "qrow";
              const inp = document.createElement("input");
              inp.type = "text";
              inp.placeholder = "Type something…";
              const prev = answers[qi];
              if (
                typeof prev === "string" &&
                !opts.some((o) => o.label === prev)
              )
                inp.value = prev;
              const ok = document.createElement("button");
              ok.textContent = "Send";
              ok.onclick = () => {
                if (!inp.value.trim()) return;
                choose(qi, inp.value.trim());
              };
              row.append(inp, ok);
              list.appendChild(row);
            }
          }
          body.appendChild(list);

          // side-by-side preview pane (single-select + any preview). Updates on
          // hover/focus; defaults to the first option that carries a preview.
          if (hasPreview) {
            const pane = document.createElement("div");
            pane.className = "qprev";
            const show = (o) => {
              pane.innerHTML =
                `<div class="qprev-h">preview</div>` +
                `<pre class="qprev-b">${esc((o && o.preview) || "")}</pre>`;
            };
            show(opts.find((o) => o.preview && o.preview.length) || opts[0]);
            list.querySelectorAll(".qopt").forEach((b, i) => {
              const o = opts[i];
              if (o && o.preview) {
                b.addEventListener("mouseenter", () => show(o));
                b.addEventListener("focus", () => show(o));
              }
            });
            body.appendChild(pane);
          }

          blk.appendChild(body);
          form.appendChild(blk);

          const foot = document.createElement("div");
          foot.className = "qfoot";
          if (qi > 0) {
            const back = document.createElement("button");
            back.className = "qlink";
            back.textContent = "← Back";
            back.onclick = () => {
              step = qi - 1;
              renderStep();
            };
            foot.appendChild(back);
          }
          const chat = document.createElement("button");
          chat.className = "qlink";
          chat.textContent = "Chat about this instead";
          chat.onclick = goChat;
          foot.appendChild(chat);
          form.appendChild(foot);

          card.appendChild(form);
          card.scrollTop = 0;
        }

        renderStep();

        function commit() {
          if (!askId) {
            toast("answer target not ready — try again", "warn");
            return;
          }
          // Build a QuestionnaireResult the extension's envelope builder understands.
          const resultAnswers = qs.map((q, qi) => {
            const a = answers[qi];
            if (Array.isArray(a)) {
              return {
                questionIndex: qi,
                question: q.question,
                kind: "multi",
                answer: null,
                selected: a,
              };
            }
            const opt = (q.options || []).find(
              (o) => (typeof o === "string" ? o : o.label) === a,
            );
            const isOption = !!opt;
            return {
              questionIndex: qi,
              question: q.question,
              kind: isOption ? "option" : "custom",
              answer: a,
              preview: isOption && opt && opt.preview ? opt.preview : undefined,
            };
          });
          api({
            type: "extension_ui_response",
            id: askId,
            value: JSON.stringify({ cancelled: false, answers: resultAnswers }),
          });
          askId = null;
          pendingAsk = null;
          setActivity("thinking…", true);
          hideModal();
        }
      }

      function uiRequest(req) {
        const { id, method } = req;
        // pi-webui ask_user_question latch: don't render an input box — the rich
        // modal was already drawn from tool_execution_start.args. Just record where
        // to send the JSON-encoded result.
        if (method === "input" && req.title === ASK_MARKER) {
          askId = id;
          return;
        }
        if (method === "notify") {
          toast(req.message || "", req.notifyType);
          return;
        }
        if (method === "setStatus") {
          statusText.textContent = stripAnsi(
            req.statusText || statusText.textContent.replace(/\s*•.*$/, ""),
          );
          return;
        }
        if (method === "set_editor_text") {
          inputEl.value = req.text || "";
          autosize();
          return;
        }
        if (method === "setTitle") {
          document.title = req.title || "pi";
          return;
        }
        if (method === "setWidget") {
          const lines = req.widgetLines;
          if (!Array.isArray(lines) || lines.length === 0) {
            widget.style.display = "none";
          } else {
            widget.innerHTML = `<div class="whead">${esc(req.widgetKey || "widget")}</div>${esc(lines.join("\n"))}`;
            widget.style.display = "block";
          }
          return;
        }

        // dialog methods
        if (method === "select") {
          const opts = req.options || [];
          showModal(
            `<h3>${esc(req.title || "Choose")}</h3><div class="opts"></div>`,
          );
          const list = card.querySelector(".opts");
          opts.forEach((o) => {
            const b = document.createElement("button");
            // ponytail: handle both flat strings and rich {label,description} options.
            const val = typeof o === "string" ? o : o.label;
            const desc = o && o.description;
            b.innerHTML =
              esc(val) + (desc ? `<span class="desc">${esc(desc)}</span>` : "");
            b.onclick = () => {
              hideModal();
              api({ type: "extension_ui_response", id, value: val });
            };
            list.appendChild(b);
          });
        } else if (method === "confirm") {
          showModal(
            `<h3>${esc(req.title || "Confirm")}</h3><details class="cmd"><summary>show command</summary><div class="cmdbody">${esc(req.message || "")}</div></details>`,
          );
          const row = document.createElement("div");
          row.className = "row";
          const yes = document.createElement("button");
          yes.textContent = "Yes";
          yes.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, confirmed: true });
          };
          const no = document.createElement("button");
          no.textContent = "No";
          no.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, confirmed: false });
          };
          row.append(yes, no);
          card.appendChild(row);
        } else if (method === "input") {
          showModal(`<h3>${esc(req.title || "Input")}</h3>`);
          const inp = document.createElement("input");
          inp.type = "text";
          inp.placeholder = req.placeholder || "";
          card.appendChild(inp);
          const row = document.createElement("div");
          row.className = "row";
          const ok = document.createElement("button");
          ok.textContent = "OK";
          ok.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, value: inp.value });
          };
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          cancel.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, cancelled: true });
          };
          row.append(ok, cancel);
          card.append(inp, row);
          setTimeout(() => inp.focus(), 10);
        } else if (method === "editor") {
          showModal(`<h3>${esc(req.title || "Edit")}</h3>`);
          const ta = document.createElement("textarea");
          ta.rows = 12;
          ta.value = req.prefill || "";
          card.appendChild(ta);
          const row = document.createElement("div");
          row.className = "row";
          const ok = document.createElement("button");
          ok.textContent = "OK";
          ok.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, value: ta.value });
          };
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          cancel.onclick = () => {
            hideModal();
            api({ type: "extension_ui_response", id, cancelled: true });
          };
          row.append(ok, cancel);
          card.append(ta, row);
          setTimeout(() => ta.focus(), 10);
        }
      }

      // ---- history rendering (full messages from get_messages) ----
      function renderMessage(msg) {
        if (msg.role === "user") {
          let txt = "";
          const c = msg.content;
          if (typeof c === "string") txt = c;
          else if (Array.isArray(c))
            txt = c
              .filter((b) => b.type === "text")
              .map((b) => b.text)
              .join("\n");
          addUser(txt);
        } else if (msg.role === "assistant") {
          newAssistantBubble();
          for (const b of msg.content || []) {
            if (b.type === "text") {
              cur.textBuf = b.text;
              ensureTextPar();
              renderText();
              cur.textPar = null;
              cur.textBuf = "";
            } else if (b.type === "thinking") {
              cur.thinkBuf = b.thinking || "";
              ensureThink(false);
              renderThink(true);
              cur.thinkDetails = null;
              cur.thinkLabel = null;
              cur.thinkCount = null;
              cur.thinkEl = null;
              cur.thinkBuf = "";
            } else if (b.type === "toolCall") {
              addToolCall(b.name, b.arguments);
            }
          }
          cur = null;
        } else if (msg.role === "toolResult") {
          const t = (msg.content || [])
            .filter((b) => b.type === "text")
            .map((b) => b.text)
            .join("\n");
          const w = toolBlock(
            msg.toolCallId || "r" + Math.random(),
            msg.toolName || "result",
            null,
            false,
          );
          w.el.classList.remove("run");
          w.el.classList.add(msg.isError ? "err" : "done");
          w.out.textContent = t;
        } else if (msg.role === "bashExecution") {
          const el = document.createElement("details");
          el.className = "tool done";
          el.innerHTML = `<summary class="head"><span class="caret">▸</span><span class="name">bash</span> <code>${esc(msg.command || "")}</code></summary><div class="out">${esc(msg.output || "")}</div>`;
          transcript.appendChild(el);
        }
      }

      // ---- streaming state ----
      function setStreaming(on) {
        streaming = on;
        dot.classList.toggle("live", on);
        stopBtn.disabled = !on;
        if (!on) cur = null;
      }

      // ---- event dispatch ----
      function handle(payload) {
        switch (payload.type) {
          case "agent_start":
            setStreaming(true);
            setActivity("thinking…", true);
            break;
          case "agent_end":
            setStreaming(false);
            setActivity("ready", false);
            break;

          case "message_start":
            if (payload.message && payload.message.role === "assistant")
              cur = newAssistantBubble();
            else if (payload.message && payload.message.role === "user") {
              /* server echoes? skip */
            }
            break;
          case "message_end":
            // finalize current text/think buffers
            if (cur) {
              renderText();
              renderThink(true);
              finalizeThink();
            }
            cur = null;
            break;

          case "message_update": {
            const e = payload.assistantMessageEvent;
            if (!e) break;
            if (
              !cur &&
              (e.type === "text_start" ||
                e.type === "text_delta" ||
                e.type === "thinking_start" ||
                e.type === "thinking_delta" ||
                e.type === "toolcall_start")
            )
              cur = newAssistantBubble();
            if (e.type === "text_start") {
              ensureTextPar();
              cur.textBuf = "";
              setActivity("writing…", true);
            } else if (e.type === "text_delta") {
              ensureTextPar();
              cur.textBuf += e.delta || "";
              scheduleRender();
            } else if (e.type === "text_end") {
              ensureTextPar();
              if (e.content != null) cur.textBuf = e.content;
              renderText();
            } else if (e.type === "thinking_start") {
              ensureThink(true);
              cur.thinkBuf = "";
              setActivity("thinking…", true);
            } else if (e.type === "thinking_delta") {
              ensureThink(true);
              cur.thinkBuf += e.delta || "";
              scheduleRender();
            } else if (e.type === "thinking_end") {
              if (e.content != null) {
                ensureThink(true);
                cur.thinkBuf = e.content;
              }
              renderThink(true);
              finalizeThink();
            } else if (e.type === "toolcall_start") {
              addToolCall(e.toolName);
            } else if (e.type === "toolcall_end") {
              /* args already shown; could update */
            }
            break;
          }

          case "tool_execution_start": {
            const w = toolBlock(
              payload.toolCallId,
              payload.toolName,
              payload.args,
              true,
            );
            if (payload.toolName === "ask_user_question" && payload.args) {
              askQuestion(payload.args);
              setActivity("waiting for your input…", false);
            } else {
              setActivity(describeTool(payload.toolName, payload.args), true);
            }
            break;
          }
          case "tool_execution_update": {
            const w = toolBlocks.get(payload.toolCallId);
            if (w && payload.partialResult) {
              const t = (payload.partialResult.content || [])
                .filter((b) => b.type === "text")
                .map((b) => b.text)
                .join("\n");
              w.out.textContent = t;
            }
            break;
          }
          case "tool_execution_end": {
            const w = toolBlocks.get(payload.toolCallId);
            // ponytail: hoist t out of the if(w) block — parseTodo(t) needs it in scope.
            // (was block-scoped → ReferenceError → panel never updated.)
            let t = "";
            if (w) {
              w.el.classList.remove("run");
              w.el.classList.add(payload.isError ? "err" : "done");
              t = ((payload.result && payload.result.content) || [])
                .filter((b) => b.type === "text")
                .map((b) => b.text)
                .join("\n");
              w.out.textContent = t;
              if (t.length > 500) w.el.open = false;
            }
            if (payload.toolName === "todo") parseTodo(t);
            setActivity("thinking…", true);
            autoscroll();
            break;
          }

          case "queue_update": {
            const s = (payload.steering || []).length,
              f = (payload.followUp || []).length;
            statusText.textContent =
              s || f
                ? `queued: ${s} steer / ${f} follow-up`
                : streaming
                  ? "working…"
                  : "ready";
            break;
          }
          case "auto_retry_start":
            toast(
              `retry ${payload.attempt}/${payload.maxAttempts}: ${(payload.errorMessage || "").slice(0, 80)}`,
              "warn",
            );
            break;
          case "compaction_start":
            note("compacting context…", "warn");
            break;
          case "compaction_end":
            note("compacted.", "ok");
            break;

          case "response":
            // rpc command ack; surface failures
            if (payload.success === false)
              toast(
                `${payload.command || "cmd"} failed: ${payload.error || ""}`,
                "err",
              );
            break;

          default:
            break;
        }
      }

      const sb = [
        "repo",
        "git",
        "model",
        "think",
        "ctx",
        "cache",
        "tok",
        "cost",
      ].reduce((o, k) => ((o[k] = $("sb-" + k)), o), {});
      function refreshSbModel() {
        sb.model.textContent =
          (modelSel.selectedOptions[0] || {}).textContent || "…";
      }
      const fmt = (n) =>
        n == null
          ? "…"
          : n >= 1e6
            ? (n / 1e6).toFixed(1) + "M"
            : n >= 1e3
              ? (n / 1e3).toFixed(1) + "k"
              : String(n);
      function refreshHealth() {
        fetch("/api/health")
          .then((r) => r.json())
          .then((h) => {
            if (!h) return;
            if (h.cwd) sb.repo.textContent = h.cwd;
            sb.git.textContent = h.git
              ? `${h.git.branch}${h.git.changes ? ` (${h.git.changes}Δ)` : ""}`
              : "—";
          })
          .catch(() => {});
      }
      function refreshStats() {
        api({ type: "get_session_stats", id: "sb-stats" });
      }
      // ---- SSE ----
      const es = new EventSource("/api/events");
      es.onopen = () => {
        statusText.textContent = "ready";
        setActivity("ready", false);
        refreshHealth();
        refreshStats();
        api({ type: "get_state", id: "init-state" });
        api({ type: "get_messages", id: "init-msgs" });
        api({ type: "get_commands", id: "init-cmds" });
        api({ type: "get_available_models", id: "init-models" });
      };
      setInterval(refreshStats, 3000);
      setInterval(refreshHealth, 6000);
      es.onmessage = (ev) => {
        let env;
        try {
          env = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (env.source === "pi") {
          const p = env.payload;
          // intercept init responses to populate UI
          if (p.type === "response" && p.success) {
            if (p.id === "init-state" && p.data) {
              if (p.data.thinkingLevel != null)
                sb.think.textContent = p.data.thinkingLevel;
              if (p.data.isStreaming != null && p.data.isStreaming) {
                setStreaming(true);
                setActivity("working…", true);
              }
              const mid = modelIdOf(p.data.model);
              if (mid) {
                currentModelId = mid;
                applyCurrentModel();
              }
            } else if (
              p.id === "init-msgs" &&
              p.data &&
              Array.isArray(p.data.messages)
            ) {
              transcript.innerHTML = "";
              toolBlocks.clear();
              p.data.messages.forEach(renderMessage);
              scrollDown();
            } else if (
              p.id === "init-cmds" &&
              p.data &&
              Array.isArray(p.data.commands)
            ) {
              commands = p.data.commands;
            } else if (
              p.id === "init-models" &&
              p.data &&
              Array.isArray(p.data.models)
            ) {
              populateModels(p.data.models);
            } else if (p.id === "sb-stats" && p.data) {
              const t = p.data.tokens || {};
              sb.tok.textContent = `${fmt(t.input)}↓ ${fmt(t.output)}↑`;
              sb.cache.textContent = `${fmt(t.cacheRead)}↓ ${fmt(t.cacheWrite)}↑`;
              sb.cost.textContent =
                p.data.cost != null ? p.data.cost.toFixed(3) : "…";
              const cu = p.data.contextUsage;
              sb.ctx.textContent =
                cu && cu.percent != null
                  ? `${cu.percent.toFixed(0)}% (${fmt(cu.tokens)}/${fmt(cu.contextWindow)})`
                  : "—";
            } else if (p.command === "set_model" && p.data) {
              const mid = modelIdOf(p.data);
              if (mid) {
                currentModelId = mid;
                localStorage.setItem("pi:model", mid);
              }
            }
          } else if (p.type === "extension_ui_request") {
            uiRequest(p);
          } else {
            if (p.type === "thinking_level_changed" && p.level != null)
              sb.think.textContent = p.level;
            else if (
              p.type === "agent_end" ||
              p.type === "session_info_changed"
            )
              refreshStats();
            handle(p);
          }
        } else if (env.source === "stderr") {
          // pi logs warnings here; show faintly only if it looks like an error
          if (/error|warn/i.test(env.payload))
            toast(env.payload.split("\n")[0].slice(0, 90), "warn");
        } else if (env.source === "pi_exit") {
          toast("pi subprocess exited — reconnecting…", "err");
        }
      };
      es.onerror = () => {
        statusText.textContent = "reconnecting…";
        setActivity("reconnecting…", false);
      };

      // ponytail: get_available_models returns no current id, so reconcile from
      // get_state.model (truth) + a localStorage hint for the very first load.
      let currentModelId = null;
      const savedModelId = localStorage.getItem("pi:model");
      function modelIdOf(m) {
        return m && m.provider && m.id ? m.provider + "/" + m.id : null;
      }
      function applyCurrentModel() {
        const id = currentModelId || savedModelId;
        if (!id) {
          refreshSbModel();
          return;
        }
        for (const opt of modelSel.options) {
          try {
            const v = JSON.parse(opt.value);
            if (v && v.provider + "/" + v.modelId === id) {
              opt.selected = true;
              refreshSbModel();
              return;
            }
          } catch {}
        }
        refreshSbModel();
      }
      function populateModels(models) {
        modelSel.innerHTML = "";
        if (!models.length) {
          const o = document.createElement("option");
          o.textContent = "no models";
          modelSel.appendChild(o);
          return;
        }
        models.forEach((m) => {
          const o = document.createElement("option");
          o.value = JSON.stringify({ provider: m.provider, modelId: m.id });
          o.textContent = (m.name || m.id) + " · " + m.provider;
          modelSel.appendChild(o);
        });
        applyCurrentModel();
      }
      modelSel.onchange = () => {
        refreshSbModel();
        try {
          const v = JSON.parse(modelSel.value);
          currentModelId = v.provider + "/" + v.modelId;
          localStorage.setItem("pi:model", currentModelId);
          api({ type: "set_model", provider: v.provider, modelId: v.modelId });
        } catch {}
      };
      $("models-btn").onclick = () =>
        api({ type: "get_available_models", id: "init-models" });

      // ---- composer ----
      function autosize() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(200, inputEl.scrollHeight) + "px";
      }
      inputEl.oninput = () => {
        autosize();
        updatePalette();
      };

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        autosize();
        hidePalette();
        addUser(text);
        let cmd;
        if (text.startsWith("/")) {
          // extension command / skill / template: send as prompt (rpc expands it)
          cmd = { type: "prompt", message: text };
        } else if (streaming) {
          const mode = modeSel.value;
          const how = mode === "auto" ? "steer" : mode; // default mid-stream delivery = steer
          cmd =
            how === "prompt"
              ? { type: "prompt", message: text }
              : { type: how, message: text };
        } else {
          cmd = { type: "prompt", message: text };
        }
        try {
          await api(cmd);
        } catch (e) {
          toast("send failed: " + e.message, "err");
        }
      }
      sendBtn.onclick = send;
      stopBtn.onclick = () => api({ type: "abort" });
      $("new").onclick = () => {
        if (
          confirm(
            "Start a new session? Current chat stays saved on the pi side.",
          )
        )
          api({ type: "new_session" });
      };

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      // ---- slash command palette ----
      const palette = $("palette");
      const widget = $("widget");
      let palSel = 0;
      let palItems = [];
      function buildFilteredList(q) {
        const term = q.slice(1).toLowerCase();
        return commands
          .filter((c) => ("/" + c.name).toLowerCase().includes(term))
          .slice(0, 8);
      }
      function updatePalette() {
        const v = inputEl.value;
        if (v.startsWith("/")) {
          palItems = buildFilteredList(v);
          if (palItems.length) {
            renderPalette();
            palette.style.display = "block";
            return;
          }
        }
        hidePalette();
      }
      function renderPalette() {
        palette.innerHTML = "";
        palItems.forEach((c, i) => {
          const d = document.createElement("div");
          d.className = "item" + (i === palSel ? " sel" : "");
          d.innerHTML = `<span class="nm">/${esc(c.name)}</span> <span class="ds">${esc(c.description || c.source || "")}</span>`;
          d.onclick = () => {
            inputEl.value = "/" + c.name + " ";
            autosize();
            inputEl.focus();
            hidePalette();
          };
          palette.appendChild(d);
        });
      }
      function hidePalette() {
        palette.style.display = "none";
        palItems = [];
        palSel = 0;
      }
      inputEl.addEventListener("keydown", (e) => {
        if (palette.style.display !== "block") return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          palSel = (palSel + 1) % palItems.length;
          renderPalette();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          palSel = (palSel - 1 + palItems.length) % palItems.length;
          renderPalette();
        } else if (e.key === "Tab" && palItems.length) {
          e.preventDefault();
          inputEl.value = "/" + palItems[palSel].name + " ";
          autosize();
          hidePalette();
          inputEl.focus();
        } else if (e.key === "Escape") {
          hidePalette();
        }
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".composer")) hidePalette();
      });

      autosize();
    </script>
  </body>
</html>
